name: Daily Job Search

on:
  workflow_dispatch:

  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: write

# Prevent two job-search runs from writing to main at the same time
concurrency:
  group: daily-job-search
  cancel-in-progress: false

jobs:
  search-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run job search
        run: |
          python job_search.py

      - name: Save job results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add new_jobs.csv

          if git diff --cached --quiet; then
            echo "No new job-result changes to commit"
          else
            git commit -m "Update daily job results"

            # Bring in anything that changed on main while this workflow ran
            git pull --rebase origin main

            git push origin HEAD:main
          fi
