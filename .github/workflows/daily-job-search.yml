name: Daily Job Search

on:
  workflow_dispatch:

  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  search-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run job search
        run: |
          python job_search.py

      - name: Update new_jobs.csv
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e

          CONTENT=$(base64 -w 0 new_jobs.csv)

          for attempt in {1..10}
          do
            echo "Update attempt $attempt"

            REMOTE_SHA=$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/contents/new_jobs.csv?ref=main" \
                --jq '.sha' \
                2>/dev/null || true
            )

            LOCAL_SHA=$(git hash-object new_jobs.csv)

            echo "Local SHA : $LOCAL_SHA"
            echo "Remote SHA: $REMOTE_SHA"

            # CSV already has exactly the same content
            if [ "$LOCAL_SHA" = "$REMOTE_SHA" ]; then
              echo "new_jobs.csv is already up to date."
              exit 0
            fi

            # File already exists
            if [ -n "$REMOTE_SHA" ]; then
              jq -n \
                --arg message "Update daily job results" \
                --arg content "$CONTENT" \
                --arg branch "main" \
                --arg sha "$REMOTE_SHA" \
                '{
                  message: $message,
                  content: $content,
                  branch: $branch,
                  sha: $sha
                }' > payload.json

            # First run: file does not exist
            else
              jq -n \
                --arg message "Create daily job results" \
                --arg content "$CONTENT" \
                --arg branch "main" \
                '{
                  message: $message,
                  content: $content,
                  branch: $branch
                }' > payload.json
            fi

            if gh api \
              --method PUT \
              "repos/${GITHUB_REPOSITORY}/contents/new_jobs.csv" \
              --input payload.json
            then
              echo "new_jobs.csv updated successfully."
              exit 0
            fi

            echo "Another run updated the CSV first. Retrying..."
            sleep 2
          done

          echo "Could not update new_jobs.csv after 10 attempts."
          exit 1
