- name: Save job results
  shell: bash
  run: |
    git config user.name "github-actions[bot]"
    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    # Keep a copy of the CSV generated by this run
    cp new_jobs.csv /tmp/new_jobs.csv

    for attempt in {1..10}
    do
      echo "Push attempt $attempt"

      # Start from the newest version of main
      git fetch origin main
      git reset --hard origin/main

      # Restore the CSV produced by this workflow
      cp /tmp/new_jobs.csv new_jobs.csv

      git add new_jobs.csv

      # Nothing changed -> successful run
      if git diff --cached --quiet; then
        echo "new_jobs.csv is already up to date"
        exit 0
      fi

      git commit -m "Update daily job results"

      # Try to push
      if git push origin HEAD:main; then
        echo "new_jobs.csv updated successfully"
        exit 0
      fi

      echo "Another run updated main. Retrying..."
      sleep 3
    done

    echo "Unable to update after 10 attempts"
    exit 1
